version: '3.8'

services:
  sync-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "1234:1234"
    environment:
      - PORT=1234
      - JWT_SECRET=glasscode-secure-secret-key-live-share
    restart: unless-stopped

  sandbox-service:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PORT=4000
    restart: unless-stopped

  frontend-client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - sync-server
      - sandbox-service
    restart: unless-stopped
